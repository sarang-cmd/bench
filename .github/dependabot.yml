# Two ecosystems, both weekly, both grouped so a quiet week does not open five
# pull requests for patch bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      site:
        patterns: ["*"]
    # These majors are not drop-in: Tailwind 4 moves the PostCSS plugin into a
    # separate package, Vite 8 changes the build pipeline, React 19 changes the
    # roots API. A bump breaks the site until someone migrates it on purpose.
    ignore:
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
