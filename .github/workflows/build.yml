name: Build

# The .g3a needs the fxSDK and a SuperH GCC, both built from source. That build
# takes the better part of an hour on a two-core runner, so it lives in its own
# job whose only success criterion is the install tree; the tree is cached and
# later runs restore it in seconds. Splitting it matters: a cache is only saved
# by a job that finishes green, and a compile error in the add-in must not throw
# the toolchain away.
#
#   push to main   -> native tests, preview, Bench-<version>.g3a as an artifact
#   push of a v*   -> the same, plus the .g3a on the GitHub release and a copy
#                     force-pushed to the `builds` branch
#   called         -> the same pipeline for another workflow (see
#                     auto-build.yml, which calls this every few days with
#                     release_tag: auto; the release is deleted and recreated,
#                     so there is always exactly one automatic build)

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A website or docs commit cannot change the .g3a; do not spend an hour
    # proving it.
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.0 (default: version.txt)"
        required: false
      release_tag:
        description: "Also publish a release under this tag (e.g. auto). Empty: no release."
        required: false
  workflow_call:
    inputs:
      version:
        description: "Version to build (default: version.txt)"
        type: string
        required: false
      release_tag:
        description: "Publish a release under this tag; an existing one is replaced."
        type: string
        required: false
      release_name:
        description: "Title for that release."
        type: string
        required: false

# A newer push on the same ref makes the older run pointless; kill it so it
# stops burning minutes.
# github.workflow is the caller's name when this file is called, so a scheduled
# build and a push build of the same ref do not cancel each other.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Creating the release needs a token that can write; without this the release
# step fails with "Resource not accessible by integration" even though the build
# itself succeeded.
permissions:
  contents: write
  actions: read

env:
  # The toolchain install tree. One key for both jobs; bump it to force a
  # rebuild after a toolchain or gint upgrade.
  TOOLCHAIN_CACHE_KEY: fxsdk-sh3eb-elf-gcc14-v1

jobs:
  native-tests:
    name: Core tests (no gint)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Build and run the native test suite
        run: make test

      - name: The README's numbers match the repository
        run: python3 tools/gen_readme_stats.py --check

      - name: Python tool tests
        run: make py-test

      # docs/tools.json comes from the add-in's own registry and spike/spike.diff
      # from the spike's sources: a hand-edited copy, or a tool added without
      # regenerating them, fails here.
      - name: The generated files match their sources
        run: |
          make sim
          python3 tools/gen_tools_json.py
          python3 tools/gen_spike_patch.py
          git diff --exit-code docs/tools.json spike/spike.diff

      - name: Host preview of the screens
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          make sim
          make shots
          ls -l docs/images/*.png | head

      - name: The site's generated files match their sources
        run: |
          node site/scripts/gen-tools.mjs
          node site/scripts/gen-stats.mjs
          node site/scripts/gen-changelog.mjs
          git diff --exit-code site/src/tools.generated.json \
                             site/src/stats.generated.json \
                             site/src/changelog.generated.json

      - name: Keep the screenshots
        uses: actions/upload-artifact@v7
        with:
          name: bench-screens
          path: docs/images/*.png
          if-no-files-found: warn

  toolchain:
    name: fxSDK and the SuperH toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          # fxSDK's CMakeLists asks pkg-config for libpng16, libusb-1.0,
          # ncurses and SDL2 (udisks2 is off via the :noudisks2 config). The
          # rest is what binutils and GCC want.
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl git python3 python3-pil \
            build-essential cmake pkg-config \
            libpng-dev libusb-1.0-0-dev libudev-dev libncurses-dev \
            libsdl2-dev zlib1g-dev \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            flex bison gawk texinfo gperf libtool-bin autoconf

      - name: Restore the toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local
            ~/.giteapc
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}-${{ runner.os }}

      - name: Install GiteaPC
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Default curl UA on purpose: this host refuses a browser User-Agent
          # (curl exit 22) and serves the script to plain curl.
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 -m 60 \
            "https://git.planet-casio.com/Lephenixnoir/GiteaPC/raw/branch/master/install.sh" \
            -o /tmp/giteapc-install.sh
          printf '\n' | bash /tmp/giteapc-install.sh

      - name: Install fxSDK, the SuperH toolchain and gint
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Every install is logged, and a failure is reported as an annotation
          # carrying the useful error lines: the raw job log lives on blob
          # storage, which some clients cannot read, while annotations come back
          # through the API.
          set -uo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          log=/tmp/toolchain.log
          : > "$log"

          say() { printf '\n=== %s ===\n' "$*" | tee -a "$log"; }

          annotate() {
            local line
            {
              tail -n 60 "$log" | grep -iE "no package|not found|cannot find|error:|failed" | tail -n 8
              tail -n 2 "$log"
            } | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do
              echo "::error title=toolchain install failed::${line:-<blank>}"
            done
          }

          # giteapc asks before installing a dependency, and a runner has no
          # stdin. printf, not yes: yes dies of SIGPIPE, which pipefail would
          # report as a failure (141).
          step() {
            say "$*"
            local rc=0
            printf 'y\n%.0s' $(seq 1 20) | "$@" >>"$log" 2>&1 || rc=$?
            if [ "$rc" -ne 0 ]; then
              say "FAILED: $* (exit $rc)"
              annotate
              exit 1
            fi
          }

          step giteapc install Lephenixnoir/fxsdk:noudisks2
          step giteapc install Lephenixnoir/sh-elf-binutils@dev
          step giteapc install Lephenixnoir/sh-elf-gcc@dev
          step giteapc install Lephenixnoir/OpenLibm Vhex-Kernel-Core/fxlibc
          step giteapc install Lephenixnoir/gint

      - name: Check the toolchain
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fxsdk --version
          fxsdk path sysroot
          cc=$(command -v sh3eb-elf-gcc || command -v sh-elf-gcc)
          "$cc" --version | head -n 1

  g3a:
    name: Build the add-in
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: [native-tests, toolchain]
    steps:
      # Full history, shallow enough to be free: the automatic build lists the
      # recent commits in its release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the version
        shell: bash
        run: |
          # A tag wins, then an input (workflow_dispatch or the caller), then
          # version.txt. An automatic build keeps the release number and is
          # identified by its build date, so the download keeps its file name.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            printf '%s\n' "${GITHUB_REF#refs/tags/v}" > version.txt
          elif [ -n "${{ inputs.version }}" ]; then
            printf '%s\n' "${{ inputs.version }}" > version.txt
          fi
          echo "building version $(cat version.txt)"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3 python3-pil

      - name: Restore the toolchain
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.local
            ~/.giteapc
          key: ${{ env.TOOLCHAIN_CACHE_KEY }}-${{ runner.os }}

      - name: Add the toolchain to PATH
        shell: bash
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A compile error must be readable: the raw job log lives on blob
      # storage, which some clients cannot fetch, so the useful lines are
      # repeated as annotations.
      - name: Build Bench
        shell: bash
        run: |
          set -o pipefail
          log=/tmp/bench-build.log
          if ! { fxsdk --version && fxsdk build-cg; } 2>&1 | tee "$log"; then
            {
              grep -iE "error:|Error [0-9]+|undefined reference|No such file|No rule to make" "$log" | tail -n 12
              tail -n 3 "$log"
            } | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do
              echo "::error title=add-in build failed::${line:-<blank>}"
            done
            exit 1
          fi
          test -f "Bench-$(cat version.txt).g3a"
          ls -lh Bench-*.g3a

      - name: Build the M1 spike add-in
        run: |
          if [ -f spike/CMakeLists.txt ]; then
            (cd spike && fxsdk build-cg)
            ls -lh spike/Bench-spike-*.g3a || true
          fi

      - name: Attach the .g3a
        uses: actions/upload-artifact@v7
        with:
          name: bench-g3a
          path: Bench-*.g3a
          if-no-files-found: error

      # The spike in its own artifact, so the add-in artifact holds one file and
      # nobody can mistake the diagnostic add-in for Bench. It is never a
      # release asset; see docs/spike.md.
      - name: Attach the M1 spike
        uses: actions/upload-artifact@v7
        with:
          name: bench-spike
          path: spike/Bench-spike-*.g3a
          if-no-files-found: ignore

      # The release notes are the CHANGELOG section for this version, written by
      # hand and committed: generate_release_notes calls a second API that the
      # token in this repository cannot reach. An automatic build has no
      # CHANGELOG section, so it lists what went in since the last one.
      - name: Collect the release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        run: |
          version=$(cat version.txt)
          python3 - "$version" "${{ inputs.release_tag }}" <<'EOF' > /tmp/release-notes.md
          import os, re, subprocess, sys

          version, tag = sys.argv[1], sys.argv[2]
          if tag:
              # Automatic build: say what is in it and nothing else. The commit
              # count is honest about "this is 1.0.0 plus later work".
              head = subprocess.run(["git", "rev-parse", "--short", "HEAD"],
                                    capture_output=True, text=True).stdout.strip()
              date = subprocess.run(["git", "show", "-s", "--format=%cs", "HEAD"],
                                    capture_output=True, text=True).stdout.strip()
              # This repository lands work through merge commits, so a
              # --no-merges list would be nearly empty; show the recent history
              # as it is.
              log = subprocess.run(["git", "log", "-10", "--format=- %s"],
                                   capture_output=True, text=True).stdout.strip()
              print("## Automatic build")
              print()
              print(f"Bench {version}, built from the tip of `main` on {date} (commit `{head}`).")
              print()
              print("Replaces the previous automatic build. For the released version, use the")
              print("tagged release instead.")
              print()
              print("### What is in it")
              print()
              print(log or "- no commits")
              sys.exit(0)

          text = open("CHANGELOG.md", encoding="utf-8").read()
          # The section runs from "## <version>" to the next "## " heading.
          match = re.search(rf"^## {re.escape(version)}.*?(?=^## |\Z)", text, re.S | re.M)
          if match:
              print(match.group(0).strip())
          else:
              print(f"Bench {version}")
          EOF
          cat /tmp/release-notes.md

      # An automatic build replaces the previous one instead of piling up: the
      # release and its tag are deleted, then recreated at the commit just
      # built, so `releases/tag/auto` always points at the newest green build.
      - name: Replace the previous automatic release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" \
            && echo "removed the old $TAG release and tag" \
            || echo "no $TAG release to remove yet"

      # Only the add-in itself goes on a release. The M1 spike is a diagnostic
      # add-in for the hardware session; it stays in the artifact, where it can
      # be fetched when it is actually needed.
      - name: Put the .g3a on the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_name != '' && inputs.release_name || (github.ref_type == 'tag' && github.ref_name || 'Bench build') }}
          target_commitish: ${{ github.sha }}
          files: Bench-*.g3a
          body_path: /tmp/release-notes.md

      # The .g3a also lives in the repository, in dist/: a release asset and an
      # artifact both live on blob storage, while a git remote works almost
      # everywhere. Only tagged and automatic builds refresh it - a plain push
      # to main would rewrite the repository on every commit - and the commit
      # says [skip ci] so it cannot start a build of its own.
      - name: Keep the .g3a in dist/ on main
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          version=$(cat version.txt)
          file="Bench-${version}.g3a"
          dir=$(mktemp -d)
          git clone --quiet --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$dir" \
            || { echo "::warning title=dist::cannot clone main; dist/ not updated"; exit 0; }
          mkdir -p "$dir/dist"
          cp "$file" "$dir/dist/$file"
          {
            printf 'version %s\n' "$version"
            printf 'file %s\n' "$file"
            printf 'size %s\n' "$(stat -c %s "$file")"
            printf 'sha256 %s\n' "$(sha256sum "$file" | cut -d' ' -f1)"
            printf 'commit %s\n' "$GITHUB_SHA"
            printf 'built %s\n' "$(date -u +%Y-%m-%d)"
          } > "$dir/dist/BUILD.txt"
          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "dist/ already holds this build"
            exit 0
          fi
          git commit --quiet -m "dist: Bench ${version} from ${GITHUB_SHA:0:7} [skip ci]"
          git push --quiet origin HEAD:main \
            || echo "::warning title=dist::main moved during the build; dist/ not updated"

      # Artifact and release downloads go through blob storage, which some
      # networks cannot reach. A branch is plain git, so the same bytes are also
      # force-pushed to `builds`: `git fetch origin builds` is enough. This runs
      # after the release and with always(), so a release hiccup cannot skip it;
      # it is last because it rewrites the working tree.
      - name: Publish the .g3a to the builds branch
        if: always() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        shell: bash
        run: |
          shopt -s nullglob
          files=(Bench-*.g3a)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .g3a was built; nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds-tmp
          git rm -rf --cached . >/dev/null
          git add -f "${files[@]}"
          git commit -m "Bench $(cat version.txt) from ${GITHUB_SHA}"
          git push --force origin HEAD:builds

  site:
    name: Site build and page checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the site's dependencies
        working-directory: site
        run: npm ci

      # Same rule as docs/tools.json for the add-in: the generated data must
      # match the files it is built from, or the build fails here.
      - name: The generated data matches its sources
        working-directory: site
        run: |
          npm run gen-tools
          npm run gen-stats
          npm run gen-changelog
          git diff --exit-code src/tools.generated.json src/stats.generated.json src/changelog.generated.json

      - name: Every route renders
        working-directory: site
        run: node scripts/check-pages.mjs

      - name: Build the site
        working-directory: site
        run: npm run build

      # The plan's browser-width sweep: every route at 320, 390, 768, 1024 and
      # 1440 pixels, failing on a horizontal scrollbar or an element that
      # crosses the right edge.
      - name: Browser widths
        working-directory: site
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          sleep 3
          # The job log lives on blob storage, which some networks cannot fetch.
          # A finding is repeated as an annotation so it can still be read.
          log=/tmp/bench-widths.log
          if ! node scripts/check-widths.mjs --url http://localhost:4173 2>&1 | tee "$log"; then
            tail -n 20 "$log" | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do
              echo "::error title=width sweep::${line:-<blank>}"
            done
            exit 1
          fi
          # A bounding-box sweep cannot see the hero band bug: the boxes never
          # touched, the glyph just overflowed its box. This one counts the
          # neighbour ink the yellow would hide.
          if ! node scripts/check-band.mjs --url http://localhost:4173 2>&1 | tee "$log"; then
            tail -n 20 "$log" | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do
              echo "::error title=hero band::${line:-<blank>}"
            done
            exit 1
          fi

  wasm:
    name: WebAssembly simulator
    runs-on: ubuntu-22.04
    # The binary is committed (site/public/sim/bench.wasm) because Vercel has no
    # C compiler, so this job is what proves that copy is current: it rebuilds
    # from the same sources the screenshots come from, runs the module in Node,
    # and fails when the committed file no longer matches the C.  zig carries
    # clang, wasm-ld and wasi-libc, so one pip install is the whole toolchain.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install zig
        run: pip install --user ziglang

      - name: Build bench.wasm from the same sources as the screenshots
        run: |
          export ZIG="$(python3 -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          sh tools/wasm/build.sh
          # Keys in, frames out: the build is only a build if the module runs.
          node tools/wasm/smoke.mjs "down,exe"
          node tools/wasm/worker-smoke.mjs "down,exe,f2"

      - name: The committed binary is this build
        run: |
          node site/scripts/copy-wasm.mjs
          git diff --exit-code site/public/sim/bench.wasm site/public/sim/demo.json \
            || { echo "::error title=bench.wasm::the committed WebAssembly build is stale - run tools/wasm/build.sh and commit site/public/sim"; exit 1; }

      - name: Keep the binary
        uses: actions/upload-artifact@v7
        with:
          name: bench-wasm
          path: |
            build-wasm/bench.wasm
            build-wasm/demo.json
          if-no-files-found: warn
