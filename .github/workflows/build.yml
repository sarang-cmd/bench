name: Build

# This workflow is the only way Bench gets a .g3a: the fxSDK toolchain comes
# from git.planet-casio.com, which the Arena sandbox that wrote the code could
# not reach.  A GitHub runner can.  See docs/toolchain.md section 5.
#
#   push to main      -> native tests, host preview, Bench-<version>.g3a as an
#                        artifact
#   push of a tag v*  -> the same, plus the .g3a attached to the GitHub release
#
# The version comes from version.txt; bump it, tag the commit, push the tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.0 (default: version.txt)"
        required: false

jobs:
  native-tests:
    name: Core tests (no gint)
    # Pinned on purpose: the fxSDK toolchain is built from source by GiteaPC,
    # and that build is only tested by its author on the older LTS.  The g3a
    # job uses the same image, so the two jobs cannot disagree about the host.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the native test suite
        run: make test

      - name: Python tool tests
        run: make py-test

      - name: Host preview of the screens
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          make sim
          make shots
          ls -l docs/images/*.png | head

      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: bench-screens
          path: docs/images/*.png
          if-no-files-found: warn

  g3a:
    name: Build the add-in
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: native-tests
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        shell: bash
        run: |
          # A tag wins, then a workflow_dispatch input, then version.txt.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            printf '%s\n' "${GITHUB_REF#refs/tags/v}" > version.txt
          elif [ -n "${{ inputs.version }}" ]; then
            printf '%s\n' "${{ inputs.version }}" > version.txt
          fi
          echo "building version $(cat version.txt)"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl git python3 python3-pil \
            build-essential cmake pkg-config libpng-dev libusb-1.0-0-dev \
            libudev-dev libncurses-dev libgmp-dev libmpfr-dev libmpc-dev

      - name: Install GiteaPC
        run: |
          curl -fsSL "https://git.planet-casio.com/Lephenixnoir/GiteaPC/raw/branch/master/install.sh" \
            -o /tmp/giteapc-install.sh
          printf '\n' | bash /tmp/giteapc-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install fxSDK, the SuperH toolchain and gint
        shell: bash
        run: |
          # Every install is logged, and a failure is reported as an annotation
          # carrying the tail of the log: the raw job log lives on blob storage,
          # which some clients (including the one that wrote this) cannot read,
          # while annotations come back through the API.
          set -uo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          log=/tmp/toolchain.log
          : > "$log"

          say() { printf '\n=== %s ===\n' "$*" | tee -a "$log"; }

          # Annotate the tail of the log, one line per annotation (GitHub keeps
          # ten per step), with the characters that would break the syntax out.
          annotate() {
            local line
            tail -n 10 "$log" | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do
              echo "::error title=toolchain install failed::${line:-<blank>}"
            done
          }

          # giteapc asks before it installs a dependency, and a runner has no
          # stdin: without an answer it dies with "EOFError: EOF when reading a
          # line".  That is what killed the first four attempts of this job.
          step() {
            say "$*"
            if ! yes | "$@" >>"$log" 2>&1; then
              say "FAILED: $*"
              annotate
              exit 1
            fi
          }

          step giteapc install Lephenixnoir/fxsdk:noudisks2
          step giteapc install Lephenixnoir/sh-elf-binutils@dev
          step giteapc install Lephenixnoir/sh-elf-gcc@dev
          step giteapc install Lephenixnoir/OpenLibm Vhex-Kernel-Core/fxlibc
          step giteapc install Lephenixnoir/gint

          { fxsdk --version || true; sh-elf-gcc --version | head -n 1; } | tee -a "$log"

      - name: Build Bench
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fxsdk build-cg
          test -f "Bench-$(cat version.txt).g3a"
          ls -lh Bench-*.g3a

      - name: Build the M1 spike add-in
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ -f spike/CMakeLists.txt ]; then
            (cd spike && fxsdk build-cg)
            ls -lh spike/Bench-spike-*.g3a || true
          fi

      - name: Attach the .g3a
        uses: actions/upload-artifact@v4
        with:
          name: bench-g3a
          path: |
            Bench-*.g3a
            spike/Bench-spike-*.g3a
          if-no-files-found: error

      - name: Put the .g3a on the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Bench-*.g3a
            spike/Bench-spike-*.g3a
          generate_release_notes: true
