name: Build

# The .g3a needs the fxSDK and a SuperH GCC, both built from source. Building
# them takes the better part of an hour on a two-core runner, so the whole
# install tree is cached and only rebuilt when the cache key changes. After the
# first run a tag build is a couple of minutes.
#
#   push to main   -> native tests, preview, Bench-<version>.g3a as an artifact
#   push of a v*   -> the same, plus the .g3a on the GitHub release, plus a copy
#                     force-pushed to the `builds` branch (site builds read the
#                     release, not this branch; the branch is for people who
#                     cannot fetch a release asset)

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A website or docs commit cannot change the .g3a; do not spend 40 minutes
    # proving it.
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.0 (default: version.txt)"
        required: false

# A newer push on the same ref makes the older run pointless; kill it so it
# stops burning minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Core tests (no gint)
    # Pinned: the toolchain is built on 22.04, and both jobs should agree.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the native test suite
        run: make test

      - name: Python tool tests
        run: make py-test

      - name: Host preview of the screens
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          make sim
          make shots
          ls -l docs/images/*.png | head

      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: bench-screens
          path: docs/images/*.png
          if-no-files-found: warn

  g3a:
    name: Build the add-in
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    needs: native-tests
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        shell: bash
        run: |
          # A tag wins, then a workflow_dispatch input, then version.txt.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            printf '%s\n' "${GITHUB_REF#refs/tags/v}" > version.txt
          elif [ -n "${{ inputs.version }}" ]; then
            printf '%s\n' "${{ inputs.version }}" > version.txt
          fi
          echo "building version $(cat version.txt)"

      - name: Install build dependencies
        run: |
          # fxSDK's CMakeLists asks pkg-config for libpng16, libusb-1.0,
          # ncurses and SDL2 (udisks2 is off via the :noudisks2 config).
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl git python3 python3-pil \
            build-essential cmake pkg-config \
            libpng-dev libusb-1.0-0-dev libudev-dev libncurses-dev \
            libsdl2-dev zlib1g-dev \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            flex bison gawk texinfo gperf libtool-bin autoconf

      # The expensive part. Restored as a tarball when the key matches, which is
      # what turns a 40-minute job into a two-minute one. Bump the key to force
      # a rebuild (new toolchain or gint version).
      - name: Restore fxSDK, the toolchain and gint
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local
            ~/.giteapc
          key: fxsdk-sh3eb-elf-gcc12-${{ runner.os }}-v1

      - name: Add the toolchain to PATH
        shell: bash
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install GiteaPC
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Default curl UA on purpose: this host rejects a browser User-Agent
          # (curl exit 22) and serves the script to plain curl. Retries because
          # the first attempt after a cold start sometimes 502s.
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 -m 60 \
            "https://git.planet-casio.com/Lephenixnoir/GiteaPC/raw/branch/master/install.sh" \
            -o /tmp/giteapc-install.sh
          printf '\n' | bash /tmp/giteapc-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install fxSDK, the SuperH toolchain and gint
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Every install is logged, and a failure is reported as an annotation
          # carrying the useful error lines: the raw job log lives on blob
          # storage, which some clients cannot read, while annotations come back
          # through the API.
          set -uo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          log=/tmp/toolchain.log
          : > "$log"

          say() { printf '\n=== %s ===\n' "$*" | tee -a "$log"; }

          annotate() {
            local line
            {
              tail -n 60 "$log" | grep -iE "no package|not found|cannot find|error:|failed" | tail -n 8
              tail -n 2 "$log"
            } | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do
              echo "::error title=toolchain install failed::${line:-<blank>}"
            done
          }

          # giteapc asks before installing a dependency, and a runner has no
          # stdin. printf, not yes: yes dies of SIGPIPE, which pipefail would
          # report as a failure (141).
          step() {
            say "$*"
            local rc=0
            printf 'y\n%.0s' $(seq 1 20) | "$@" >>"$log" 2>&1 || rc=$?
            if [ "$rc" -ne 0 ]; then
              say "FAILED: $* (exit $rc)"
              annotate
              exit 1
            fi
          }

          step giteapc install Lephenixnoir/fxsdk:noudisks2
          step giteapc install Lephenixnoir/sh-elf-binutils@dev
          step giteapc install Lephenixnoir/sh-elf-gcc@dev
          step giteapc install Lephenixnoir/OpenLibm Vhex-Kernel-Core/fxlibc
          step giteapc install Lephenixnoir/gint

          { fxsdk --version || true; sh3eb-elf-gcc --version | head -n 1; } | tee -a "$log"

      - name: Check the toolchain
        run: |
          fxsdk --version
          fxsdk path sysroot
          # The giteapc package is called sh-elf-gcc but installs the sh3eb-elf
          # toolchain the fxSDK expects; accept either prefix.
          cc=$(command -v sh3eb-elf-gcc || command -v sh-elf-gcc)
          "$cc" --version | head -n 1

      - name: Build Bench
        run: |
          fxsdk build-cg
          test -f "Bench-$(cat version.txt).g3a"
          ls -lh Bench-*.g3a

      - name: Build the M1 spike add-in
        run: |
          if [ -f spike/CMakeLists.txt ]; then
            (cd spike && fxsdk build-cg)
            ls -lh spike/Bench-spike-*.g3a || true
          fi

      - name: Attach the .g3a
        uses: actions/upload-artifact@v4
        with:
          name: bench-g3a
          path: |
            Bench-*.g3a
            spike/Bench-spike-*.g3a
          if-no-files-found: error

      - name: Put the .g3a on the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Bench-*.g3a
            spike/Bench-spike-*.g3a
          generate_release_notes: true

      # Artifact and release downloads go through blob storage, which some
      # networks cannot reach. A branch is plain git, so the same bytes are also
      # force-pushed to `builds`: `git fetch origin builds` is enough to get
      # them. Runs last, because it rewrites the working tree.
      - name: Publish the .g3a to the builds branch
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds-tmp
          git rm -rf --cached . >/dev/null
          git add -f Bench-*.g3a
          git commit -m "Bench $(cat version.txt) from ${GITHUB_SHA}"
          git push --force origin HEAD:builds
